# Patch-style releases: push a tag vX.Y.Z on main to build, test, and publish the plugin DLLs.
# See .github/workflows/README.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  DEADWORKS_VERSION: v0.4.18 # keep in step with scripts/fetch-deadworks.sh and the server
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: scripts/fetch-deadworks.sh
      - run: scripts/update.sh
      - run: scripts/test.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            GunGame/bin/Release/net10.0/GunGame.dll \
            RiftRoulette/bin/Release/net10.0/RiftRoulette.dll \
            DevTools/bin/Release/net10.0/DevTools.dll \
            CleanSlate/bin/Release/net10.0/CleanSlate.dll \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
