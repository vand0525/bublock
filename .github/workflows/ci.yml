# Build and test every push and PR. No server access, nothing uploaded.
# See .github/workflows/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEADWORKS_VERSION: v0.4.18 # keep in step with scripts/fetch-deadworks.sh and the server
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: scripts/fetch-deadworks.sh
      - run: scripts/update.sh
      - run: scripts/test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ github.sha }}
          path: |
            RiftRoulette/bin/Release/net10.0/RiftRoulette.dll
            GunGame/bin/Release/net10.0/GunGame.dll
            DevTools/bin/Release/net10.0/DevTools.dll
            CleanSlate/bin/Release/net10.0/CleanSlate.dll
          retention-days: 14

  # A red build on main opens (or updates) one "CI failing on main" issue; the next green build closes it.
  report-failure:
    needs: build-test
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"CI failing on main" in:title' --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Still failing at $GITHUB_SHA: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI failing on main" \
              --label "type: bug" --label "area: ci-cd" --label "P0 critical" \
              --body "Build or tests failed on main at $GITHUB_SHA: $RUN_URL"
          fi

  close-on-green:
    needs: build-test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"CI failing on main" in:title' --json number -q '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Green again at $GITHUB_SHA."
          done

